[panel]
# Position sur le petit moniteur 480x320. Plein ecran pile (moniteur 480x320 natif).
x = 1300
y = 1440
locked = true
topmost = true
# Intervalle de refresh en ms (1000 = comme AIDA par defaut)
interval_ms = 1000
# Points des graphs : pas 10 px du .sp2 sur 480 px = 48 points (48 s)
history = 48
# Theme du panneau : 1..9 (voir README, maquettes dans ui_proposals.html)
# 1=AIDA+  2=HUD  3=Anneaux  4=Tuiles  5=Colonnes  6=Oscillo  7=Double  8=Frise  9=Split
# Surcharge possible en ligne de commande : python sensor_panel.py --theme=6
theme = 13-neon
# Tenter la temperature CPU via LibreHardwareMonitor (necessite admin pour Ryzen). true/false
cpu_temp_lhm = true

[colors]
label = #1FE01F
value = #4EC221
graph = #56DC23
# Couleur 2e trace (GPU) pour les themes a deux courbes
graph2 = #4EC221
grid = #008000
frame = #005E00
bg = #000000
