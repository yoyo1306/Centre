<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>P4 — Minimal Mono</title>
<style>
  html,body{margin:0;padding:0;background:#050505;overflow:hidden;cursor:default}
  #stage{position:relative;width:480px;height:320px;background:#050505;overflow:hidden;
         font-family:"Inter","Segoe UI",system-ui,sans-serif;color:#f2f2f2}
  .half{position:absolute;left:0;width:480px;height:158px}
  #h1{top:0}#h2{top:162px}
  .sep{position:absolute;left:24px;right:24px;top:159px;height:1px;background:#262626}
  .g-num{position:absolute;left:24px;top:24px;font-size:76px;font-weight:200;
         letter-spacing:-4px;line-height:.9;font-variant-numeric:tabular-nums}
  .g-num small{font-size:20px;font-weight:300;color:#5b5b5b;letter-spacing:0;margin-left:2px}
  .g-name{position:absolute;left:26px;top:106px;font-size:11px;font-weight:500;
          letter-spacing:.6px;color:#8f8f8f;max-width:200px}
  .g-use{position:absolute;left:26px;top:126px;font-size:11px;color:#c9c9c9;font-variant-numeric:tabular-nums}
  .g-use b{font-weight:600;color:#f2f2f2}
  canvas{position:absolute}
  .dot{position:absolute;left:24px;top:16px;width:6px;height:6px;border-radius:50%;background:#3a3a3a}
</style>
</head>
<body>
<div id="stage">
  <div class="half" id="h1">
    <div class="dot" id="d1"></div>
    <div class="g-num" id="t1">54<small>°C</small></div>
    <div class="g-name" id="n1">AMD Ryzen 5 7600X</div>
    <div class="g-use">USAGE <b id="u1">24</b> %</div>
    <canvas id="c1" width="236" height="110" style="left:224px;top:20px"></canvas>
    <div class="sep" style="left:248px;right:24px;top:130px;height:1px"></div>
    <div class="g-name" style="left:226px;top:136px;color:#4a4a4a;font-size:9px;letter-spacing:1.4px">60s · 1 pt/s</div>
  </div>
  <div class="sep"></div>
  <div class="half" id="h2">
    <div class="dot" id="d2"></div>
    <div class="g-num" id="t2">44<small>°C</small></div>
    <div class="g-name" id="n2">NVIDIA GeForce RTX 5080</div>
    <div class="g-use">USAGE <b id="u2">11</b> %</div>
    <canvas id="c2" width="236" height="110" style="left:224px;top:20px"></canvas>
    <div class="sep" style="left:248px;right:24px;top:130px;height:1px"></div>
    <div class="g-name" style="left:226px;top:136px;color:#4a4a4a;font-size:9px;letter-spacing:1.4px">60s · 1 pt/s</div>
  </div>
</div>
<script>
const N=60;let cpu=24,gpu=11;const hC=[],hG=[];
function spark(id,h,active){
  const c=document.getElementById(id).getContext("2d");c.clearRect(0,0,236,110);
  if(h.length<2)return;
  // pas adaptatif : les points avancent de gauche à droite, point récent collé à droite
  const pts=h.map((v,i)=>{
    const x=222-((h.length-1-i)*(222/(N-1)));
    return [x, 96-(v/100)*80];
  });
  c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));
  c.strokeStyle=active?"#e8e8e8":"#3a3a3a";c.lineWidth=1.6;c.lineJoin="round";c.stroke();
  const last=pts[pts.length-1];
  c.beginPath();c.arc(last[0],last[1],3,0,7);c.fillStyle=active?"#fff":"#666";c.fill();
  // baseline
  c.strokeStyle="#1d1d1d";c.lineWidth=1;
  c.beginPath();c.moveTo(0,96.5);c.lineTo(236,96.5);c.stroke();
}
function tick(){
  cpu=Math.max(2,Math.min(100,cpu+(Math.random()*2-1)*15));
  gpu=Math.max(2,Math.min(100,gpu+(Math.random()*2-1)*18));
  hC.push(cpu);hG.push(gpu);if(hC.length>N){hC.shift();hG.shift();}
  const tc=Math.round(37+cpu*0.42), tg=Math.round(36+gpu*0.32);
  const a1=tc>=80,a2=tg>=80;
  const t1=document.getElementById("t1"),t2=document.getElementById("t2");
  t1.innerHTML=tc+"<small>°C</small>"; t2.innerHTML=tg+"<small>°C</small>";
  t1.style.color=a1?"#ff5c5c":"#f2f2f2"; t2.style.color=a2?"#ff5c5c":"#f2f2f2";
  document.getElementById("d1").style.background=a1?"#ff5c5c":"#3a3a3a";
  document.getElementById("d2").style.background=a2?"#ff5c5c":"#3a3a3a";
  document.getElementById("u1").textContent=cpu.toFixed(0);
  document.getElementById("u2").textContent=gpu.toFixed(0);
  spark("c1",hC,!a1);spark("c2",hG,!a2);
}
tick();setInterval(tick,1000);
</script>
</body>
</html>
