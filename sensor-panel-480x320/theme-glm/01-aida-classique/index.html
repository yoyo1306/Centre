  <div class="name shadowed"  id="gpuName" style="left:10px;top:172px;font-size:15px"></div>
  <div class="temp shadowed"  id="gpuTemp" style="right:2px;top:170px;font-size:21px"></div>

<script>
const CPU_NAME="AMD Ryzen 5 7600X", GPU_NAME="NVIDIA GeForce RTX 5080";
const cpuName=document.getElementById("cpuName"), cpuTemp=document.getElementById("cpuTemp");
const gpuName=document.getElementById("gpuName"), gpuTemp=document.getElementById("gpuTemp");
const t1=document.getElementById("title1"), t2=document.getElementById("title2");
cpuName.textContent=CPU_NAME; gpuName.textContent=GPU_NAME;

let cpu=24, gpu=11;
const hCpu=[], hGpu=[], N=49;
function walk(v,amp){return Math.max(2,Math.min(100,v+(Math.random()*2-1)*amp));}

function polyline(hist,top,h){
  const pts=[]; const n=hist.length; const x0=Math.max(0,(480-1)-(n-1)*10);
  for(let i=0;i<n;i++){
    const v=Math.min(Math.max(hist[i],0),100)/100;
    pts.push(x0+i*10, top+(120-2)-v*(120-4));
  }
  return pts;
}
function draw(id,hist,top){
  const c=document.getElementById(id).getContext("2d");
  c.clearRect(0,0,480,120);
  c.strokeStyle="#56DC23"; c.lineWidth=3; c.lineJoin="round";
  c.beginPath(); const p=polyline(hist,top);
  c.moveTo(p[0],p[1]); for(let i=2;i<p.length;i+=2)c.lineTo(p[i],p[i+1]);
  c.stroke();
}
function tick(){
  cpu=walk(cpu,14); gpu=walk(gpu,18);
  const cpuT=(38+cpu*0.40+Math.random()*2), gpuT=(36+gpu*0.30+Math.random()*2);
  hCpu.push(cpu); if(hCpu.length>N)hCpu.shift();
  hGpu.push(gpu); if(hGpu.length>N)hGpu.shift();
  cpuTemp.textContent=cpuT.toFixed(1)+" °C";
  gpuTemp.textContent=gpuT.toFixed(1)+" °C";
  t1.textContent="Utilisation du processeur  —  "+cpu.toFixed(0)+" %";
  t2.textContent="Utilisation du GPU  —  "+gpu.toFixed(0)+" %";
  draw("g1",hCpu,40); draw("g2",hGpu,200);
}
tick(); setInterval(tick,1000);
</script>
