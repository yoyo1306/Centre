<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>P5 — Cyber Néon</title>
<style>
  html,body{margin:0;padding:0;background:#08001a;overflow:hidden;cursor:default}
  #stage{position:relative;width:480px;height:320px;background:
      linear-gradient(180deg,#0a0022 0%,#120035 55%,#1b0550 100%);overflow:hidden;
      font-family:"Orbitron","Segoe UI",sans-serif;color:#d7dcff}
  /* grille perspective en bas */
  #grid{position:absolute;left:-80px;right:-80px;bottom:-14px;height:96px;pointer-events:none;
     background:
       repeating-linear-gradient(90deg, rgba(255,0,200,.16) 0 1px, transparent 1px 26px),
       repeating-linear-gradient(0deg, rgba(0,229,255,.14) 0 1px, transparent 1px 14px);
     transform:perspective(180px) rotateX(58deg);transform-origin:50% 100%}
  .hd{display:flex;justify-content:space-between;align-items:center;padding:9px 14px 7px;
      font-size:11px;letter-spacing:3px;font-weight:700}
  .hd .l{color:#00e5ff;text-shadow:0 0 10px rgba(0,229,255,.8)}
  .hd .r{color:#ff3ec8;text-shadow:0 0 10px rgba(255,62,200,.8);font-variant-numeric:tabular-nums}
  .panel{position:absolute;left:12px;width:456px;height:126px;border-radius:10px;
         padding:10px 14px;box-sizing:border-box}
  #p1{top:38px;background:linear-gradient(180deg,rgba(0,229,255,.09),rgba(0,229,255,.02));
      border:1px solid rgba(0,229,255,.45);box-shadow:0 0 14px rgba(0,229,255,.25),inset 0 0 24px rgba(0,229,255,.06)}
  #p2{top:174px;background:linear-gradient(180deg,rgba(255,62,200,.09),rgba(255,62,200,.02));
      border:1px solid rgba(255,62,200,.45);box-shadow:0 0 14px rgba(255,62,200,.25),inset 0 0 24px rgba(255,62,200,.06)}
  .pname{font-size:10px;font-weight:700;letter-spacing:2.4px;color:#9aa8ff}
  #p1 .pname{color:#7ff3ff} #p2 .pname{color:#ffa8ea}
  .nums{display:flex;justify-content:space-between;align-items:flex-end;margin-top:6px}
  .temp{font-size:44px;font-weight:800;font-style:italic;line-height:.9;letter-spacing:-1px}
  #p1 .temp{color:#00e5ff;text-shadow:0 0 16px rgba(0,229,255,.9)}
  #p2 .temp{color:#ff3ec8;text-shadow:0 0 16px rgba(255,62,200,.9)}
  .temp small{font-size:16px;font-weight:500}
  .uv{font-size:38px;font-weight:800;font-style:italic;line-height:.9;font-variant-numeric:tabular-nums}
  .uv small{font-size:14px;font-weight:500;color:#8b93c6}
  #p1 .uv{color:#c4fbff;text-shadow:0 0 12px rgba(0,229,255,.6)}
  #p2 .uv{color:#ffd6f4;text-shadow:0 0 12px rgba(255,62,200,.6)}
  .lbl{font-size:8px;letter-spacing:2.2px;color:#7780b8;margin-top:5px;font-weight:500}
  .segbar{position:absolute;left:14px;right:14px;bottom:12px;display:flex;gap:3px}
  .segbar i{flex:1;height:8px;border-radius:2px;background:rgba(255,255,255,.07)}
  #p1 .segbar i.on{background:#00e5ff;box-shadow:0 0 6px rgba(0,229,255,.9)}
  #p2 .segbar i.on{background:#ff3ec8;box-shadow:0 0 6px rgba(255,62,200,.9)}
</style>
</head>
<body>
<div id="stage">
  <div class="hd"><span class="l">⌁ SENSOR PANEL</span><span class="r" id="clock">--:--</span></div>
  <div class="panel" id="p1">
    <div class="pname">CPU · AMD RYZEN 5 7600X</div>
    <div class="nums">
      <div><div class="temp" id="t1">54<small>°C</small></div><div class="lbl">TEMPÉRATURE</div></div>
      <div style="text-align:right"><div class="uv" id="u1">24<small>%</small></div><div class="lbl">UTILISATION</div></div>
    </div>
    <div class="segbar" id="s1"></div>
  </div>
  <div class="panel" id="p2">
    <div class="pname">GPU · RTX 5080</div>
    <div class="nums">
      <div><div class="temp" id="t2">44<small>°C</small></div><div class="lbl">TEMPÉRATURE</div></div>
      <div style="text-align:right"><div class="uv" id="u2">11<small>%</small></div><div class="lbl">UTILISATION</div></div>
    </div>
    <div class="segbar" id="s2"></div>
  </div>
  <div id="grid"></div>
</div>
<script>
let cpu=24,gpu=11;
function segInit(id){const s=document.getElementById(id);s.innerHTML="";
  for(let i=0;i<28;i++)s.appendChild(document.createElement("i"));}
segInit("s1");segInit("s2");
function segs(id,v){const ks=document.getElementById(id).children;const on=Math.round(v/100*28);
  for(let i=0;i<28;i++)ks[i].className=i<on?"on":"";}
function pad(n){return String(n).padStart(2,"0");}
function tick(){
  cpu=Math.max(2,Math.min(100,cpu+(Math.random()*2-1)*15));
  gpu=Math.max(2,Math.min(100,gpu+(Math.random()*2-1)*18));
  const tc=Math.round(37+cpu*0.42),tg=Math.round(36+gpu*0.32);
  const t1=document.getElementById("t1"),t2=document.getElementById("t2");
  t1.innerHTML=(tc<10?"0":"")+tc+"<small>°C</small>";
  t2.innerHTML=(tg<10?"0":"")+tg+"<small>°C</small>";
  document.getElementById("u1").innerHTML=(cpu<10?"0":"")+cpu.toFixed(0)+"<small>%</small>";
  document.getElementById("u2").innerHTML=(gpu<10?"0":"")+gpu.toFixed(0)+"<small>%</small>";
  segs("s1",cpu);segs("s2",gpu);
  const d=new Date();
  document.getElementById("clock").textContent=pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());
}
tick();setInterval(tick,1000);
</script>
</body>
</html>
