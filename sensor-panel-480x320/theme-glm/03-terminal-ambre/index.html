<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>P3 — Terminal Ambre</title>
<style>
  html,body{margin:0;padding:0;background:#0a0600;overflow:hidden;cursor:default}
  #stage{position:relative;width:480px;height:320px;background:#0a0600;overflow:hidden;
         font-family:"JetBrains Mono","Consolas",monospace;color:#ffb000}
  #stage::after{content:"";position:absolute;inset:0;pointer-events:none;
      background:repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px);}
  #glow{position:absolute;inset:0;pointer-events:none;
      background:radial-gradient(420px 300px at 50% 45%, rgba(255,176,0,.05), transparent 70%);}
  .hd{display:flex;justify-content:space-between;align-items:center;
      padding:8px 12px;border-bottom:1px dashed rgba(255,176,0,.35);font-size:11px;letter-spacing:1px}
  .hd b{font-weight:700}
  #clock{color:#ff8f00}
  .sec{padding:8px 12px 4px}
  .lab{font-size:11px;letter-spacing:1px;color:#ffa726}
  .row{display:flex;justify-content:space-between;align-items:flex-start;margin-top:2px}
  .big{font-size:34px;line-height:1;color:#ffb000;text-shadow:0 0 8px rgba(255,176,0,.75);
       font-variant-numeric:tabular-nums}
  .big small{font-size:16px;color:#c77700}
  .usebig{font-size:34px;line-height:1;color:#ffc46b;text-align:right;text-shadow:0 0 8px rgba(255,196,107,.6)}
  .usebig small{font-size:16px;color:#c77700}
  canvas{display:block;margin-top:6px}
  .blink{animation:bl 1.1s steps(1) infinite}
  @keyframes bl{50%{opacity:0}}
  .foot{position:absolute;bottom:6px;left:12px;right:12px;display:flex;justify-content:space-between;
        font-size:10px;color:#b36b00;border-top:1px dashed rgba(255,176,0,.25);padding-top:5px}
  .seg{display:flex;gap:3px;margin-top:6px}
  .seg i{width:17px;height:9px;background:rgba(255,176,0,.13)}
  .seg i.on{background:#ffb000;box-shadow:0 0 6px rgba(255,176,0,.8)}
</style>
</head>
<body>
<div id="stage">
  <div class="hd"><b>SENSORPANEL // SYS.01</b><span id="clock">--:--:--</span></div>
  <div class="sec">
    <div class="lab">> CPU — AMD R5 7600X</div>
    <div class="row">
      <div class="big" id="ct">54<small> °C</small></div>
      <div class="usebig" id="cu">24<small> %</small></div>
    </div>
    <div class="seg" id="cs"></div>
    <canvas id="gc" width="456" height="46"></canvas>
  </div>
  <div class="sec">
    <div class="lab">> GPU — RTX 5080</div>
    <div class="row">
      <div class="big" id="gt">44<small> °C</small></div>
      <div class="usebig" id="gu">11<small> %</small></div>
    </div>
    <div class="seg" id="gs" style="width:456px"></div>
    <canvas id="gg" width="456" height="46"></canvas>
  </div>
  <div class="foot">
    <span>● POLL 1.0s <span class="blink">_</span></span>
    <span id="src">NVML:LHM OK</span>
  </div>
  <div id="glow"></div>
</div>
<script>
const N=48;let cpu=24,gpu=11;const hc=[],hg=[];
function segInit(id){const s=document.getElementById(id);s.innerHTML="";for(let i=0;i<24;i++)s.appendChild(document.createElement("i"));}
segInit("cs");segInit("gs");
function segs(id,v){const ks=document.getElementById(id).children;const on=Math.round(v/100*24);
  for(let i=0;i<24;i++)ks[i].className=i<on?"on":"";}
function trail(id,h){
  const c=document.getElementById(id).getContext("2d");c.clearRect(0,0,456,46);
  // rendu avec traînée phosphore : 3 passes décalées en opacité
  const pts=h.map((v,i)=>[i*9.6, 42-(v/100)*38]);
  function line(width,alpha){
    c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));
    c.strokeStyle=`rgba(255,176,0,${alpha})`;c.lineWidth=width;c.stroke();
  }
  line(6,.08);line(4,.18);line(2,.9);
}
function pad(n){return String(n).padStart(2,"0");}
function tick(){
  cpu=Math.max(2,Math.min(100,cpu+(Math.random()*2-1)*15));
  gpu=Math.max(2,Math.min(100,gpu+(Math.random()*2-1)*18));
  hc.push(cpu);hg.push(gpu);if(hc.length>N){hc.shift();hg.shift();}
  const tc=(38+cpu*0.42).toFixed(0),tg=(36+gpu*0.32).toFixed(0);
  document.getElementById("ct").innerHTML=tc+"<small> °C</small>";
  document.getElementById("gt").innerHTML=tg+"<small> °C</small>";
  document.getElementById("cu").innerHTML=cpu.toFixed(0)+"<small> %</small>";
  document.getElementById("gu").innerHTML=gpu.toFixed(0)+"<small> %</small>";
  segs("cs",cpu);segs("gs",gpu);trail("gc",hc);trail("gg",hg);
  const d=new Date();document.getElementById("clock").textContent=
    pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());
}
tick();setInterval(tick,1000);
</script>
</body>
</html>
