<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>P2 — Modern Dark</title>
<style>
  html,body{margin:0;padding:0;background:#0b0f14;overflow:hidden;cursor:default}
  #stage{position:relative;width:480px;height:320px;background:
      radial-gradient(320px 220px at 18% 0%, #141c26 0%, #0b0f14 60%);overflow:hidden;
      font-family:"Inter","Segoe UI",system-ui,sans-serif;color:#e6edf3}
  .card{position:absolute;left:10px;width:460px;height:146px;border-radius:14px;
        background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.09);
        box-shadow:0 6px 24px rgba(0,0,0,.45);padding:14px 18px;box-sizing:border-box}
  #card1{top:8px} #card2{top:166px}
  .row{display:flex;align-items:center;justify-content:space-between}
  .dev{font-size:11px;font-weight:600;letter-spacing:2.2px;color:#8b98a9;text-transform:uppercase}
  .chip{font-size:10px;font-weight:600;letter-spacing:1px;padding:3px 8px;border-radius:999px}
  .ok{color:#34d399;background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.3)}
  .warn{color:#fbbf24;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.35)}
  .big{display:flex;align-items:flex-end;justify-content:space-between;margin-top:2px}
  .temp{font-size:52px;font-weight:200;line-height:1;letter-spacing:-1px}
  .temp small{font-size:18px;font-weight:300;color:#64748b;margin-left:2px}
  .lbl{font-size:9px;font-weight:600;letter-spacing:1.8px;color:#566372;text-transform:uppercase;margin-top:4px}
  .use{text-align:right}
  .use .val{font-size:34px;font-weight:300;line-height:1;font-variant-numeric:tabular-nums}
  .use .val b{font-weight:300;color:#64748b;font-size:18px}
  canvas{position:absolute;left:0}
  .bar-mini{position:absolute;left:18px;right:18px;bottom:12px;height:3px;border-radius:2px;
            background:rgba(255,255,255,.08)!important;overflow:hidden}
  .bar-mini i{display:block;height:100%;border-radius:2px}
  #c1{top:78px}#c2{top:236px}
</style>
</head>
<body>
<div id="stage">
  <div class="card" id="card1">
    <div class="row"><div class="dev" id="n1">AMD Ryzen 5 7600X</div><div class="chip ok" id="s1">STABLE</div></div>
    <div class="big">
      <div><div class="temp" id="t1" style="color:#38bdf8">54<small>°C</small></div><div class="lbl">Température</div></div>
      <div class="use"><div class="val"><span id="u1">24</span><b> %</b></div><div class="lbl">Utilisation</div></div>
    </div>
    <canvas id="c1" width="460" height="52" style="top:74px"></canvas>
    <div class="bar-mini" style="width:424px!important"><i id="b1" style="width:24%;background:#38bdf8"></i></div>
  </div>
  <div class="card" id="card2">
    <div class="row"><div class="dev" id="n2">NVIDIA GeForce RTX 5080</div><div class="chip ok" id="s2">STABLE</div></div>
    <div class="big">
      <div><div class="temp" id="t2" style="color:#a78bfa">44<small>°C</small></div><div class="lbl">Température</div></div>
      <div class="use"><div class="val"><span id="u2">11</span><b> %</b></div><div class="lbl">Utilisation</div></div>
    </div>
    <canvas id="c2b" width="460" height="52" style="top:74px"></canvas>
    <div class="bar-mini" style="width:424px!important"><i id="b2" style="width:11%;background:#a78bfa"></i></div>
  </div>
</div>
<script>
const N=90;
let cpu=24,gpu=11,tc=54,tg=44;const hC=[],hG=[];
function push(h,v){h.push(v);if(h.length>N)h.shift();}
function spark(id,h,color){
  const c=document.getElementById(id).getContext("2d");
  c.clearRect(0,0,460,52);
  // gradient area
  const g=c.createLinearGradient(0,0,0,52);
  g.addColorStop(0,color+"55"); g.addColorStop(1,color+"00");
  c.beginPath();
  h.forEach((v,i)=>{const x=i/(N-1)*456, y=46-(v/100)*40; i?c.lineTo(x,y):c.moveTo(x,y);});
  c.strokeStyle=color;c.lineWidth=2;c.lineJoin="round";c.stroke();
  c.lineTo(456,52);c.lineTo(0,52);c.closePath();c.fillStyle=g;c.fill();
}
function chip(id,v){const el=document.getElementById(id);
  if(v>=75){el.textContent="CHAUD";el.className="chip warn";}
  else{el.textContent="STABLE";el.className="chip ok";}}
function tick(){
  cpu=Math.max(2,Math.min(100,cpu+(Math.random()*2-1)*16));
  gpu=Math.max(2,Math.min(100,gpu+(Math.random()*2-1)*20));
  tc=38+cpu*0.42; tg=36+gpu*0.32;
  push(hC,cpu);push(hG,gpu);
  const rt=tc.toFixed(0), gt=tg.toFixed(0);
  const t1=document.getElementById("t1"),t2=document.getElementById("t2");
  t1.style.color=tc>=75?"#fb7185":tc>=65?"#fbbf24":"#38bdf8";
  t2.style.color=tg>=75?"#fb7185":tg>=65?"#fbbf24":"#a78bfa";
  t1.innerHTML=rt+"<small>°C</small>"; t2.innerHTML=gt+"<small>°C</small>";
  document.getElementById("u1").textContent=cpu.toFixed(0);
  document.getElementById("u2").textContent=gpu.toFixed(0);
  document.getElementById("b1").style.width=cpu+"%";
  document.getElementById("b2").style.width=gpu+"%";
  chip("s1",tc);chip("s2",tg);
  spark("c1",hC,"#38bdf8"); spark("c2b",hG,"#a78bfa");
}
tick();setInterval(tick,1000);
</script>
</body>
</html>
